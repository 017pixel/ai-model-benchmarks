<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Terraria Clone</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #loading {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #4a90d9 0%, #2c5f8a 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        z-index: 1000;
        gap: 16px;
      }
      #loading h1 {
        font-size: 48px;
        text-shadow: 3px 3px 0 #1a3a5a, 0 0 20px rgba(255,255,255,0.3);
        letter-spacing: 2px;
      }
      #loading .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #loading .hint { font-size: 14px; opacity: 0.8; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>TERRARIA CLONE</h1>
      <div class="spinner"></div>
      <div>Generiere Welt...</div>
      <div class="hint">WASD bewegen · Maus bauen/abbauen · M Modus · E Inventar</div>
    </div>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
